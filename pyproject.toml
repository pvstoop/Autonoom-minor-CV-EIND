[project]
name = "cv-nn"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "rfdetr[augment,train]>=1.11.2",
    "scipy>=1.13",
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
rfdetr = { path = "third_party/rf-detr", editable = true }
