[project]
name = "cv-eind"
version = "0.1.0"
description = "Onderdelen detecteren en classificeren met YOLO-OBB"
requires-python = ">=3.14"
dependencies = [
"joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shapely>=2.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 99  # PEP8: 79, of 99 als het team dat afspreekt

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]
ignore = ["D203", "D213", "D205", "D400", "D401", "D415"]  # regels voor Engelse zinnen
